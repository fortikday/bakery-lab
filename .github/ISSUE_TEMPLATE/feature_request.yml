name: Feature idea
description: Suggest a useful change to Bakery Lab.
title: "Idea: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow you want to improve. Use fictional examples and leave out private bakery records, credentials, and personal information.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who has this problem and when it happens.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: Describe what someone should be able to do and the result they would see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional. How do you handle this today? Are there other approaches worth considering?
